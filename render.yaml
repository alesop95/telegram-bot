services:
  - type: web
    name: telegram-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-bot-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000

databases:
  - name: telegram-bot-db
    databaseName: telegram_bot
    user: botuser
    plan: free
    region: frankfurt
    postgresMajorVersion: 15
